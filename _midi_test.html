<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>MIDI测试</title></head>
<body>
<script src="midi_player.js"></script>
<script>
"use strict";
(async()=>{
  const out=[];
  try{
    const p=new MidiPlayer();
    const t0=performance.now();
    await p.load("assets/midi/102.mid");
    const dt=(performance.now()-t0).toFixed(0);
    const info=p.parsed;
    out.push(`加载 ${dt}ms, 音符数=${info.notes.length}, 总时长=${info.total.toFixed(1)}s`);
    // 试听 6 秒
    p.onended=()=>{out.push("ended")};
    p.play();
    document.title="OK:"+info.notes.length;
    setTimeout(()=>{p.stop();document.body.innerHTML="<pre>"+out.join("\n")+"\n播放6秒后停止,无异常</pre>";},6000);
  }catch(e){
    document.title="ERR:"+e;
    document.body.textContent="ERR "+e;
  }
})();
</script>
</body></html>
