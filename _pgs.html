<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>宠物连连看（原版素材复刻）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei",sans-serif;background:#1e1e2e;color:#eee;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:12px;user-select:none}
h1{font-size:22px;margin:4px 0 8px;color:#ffd54f;letter-spacing:2px}
#statusbar{display:flex;gap:14px;align-items:center;background:#2a2a3d;padding:8px 14px;border-radius:8px;font-size:13px;flex-wrap:wrap;justify-content:center;max-width:640px}
#statusbar b{color:#ffd54f}
#timebarWrap{flex:1;min-width:140px;height:14px;background:#111;border:1px solid #555;border-radius:7px;overflow:hidden}
#timebar{height:100%;width:100%;background:linear-gradient(90deg,#4caf50,#8bc34a);transition:width .1s linear}
#timebar.low{background:linear-gradient(90deg,#f44336,#ff5722)}
#timebar.bonus{box-shadow:0 0 10px 3px #6dff6d;filter:brightness(1.6)}
#boardWrap{position:relative;margin-top:10px;background:#404048;border:3px solid #555;border-radius:4px;box-shadow:0 6px 24px rgba(0,0,0,.6)}
#board{position:relative}
#fx{position:absolute;left:-56px;top:-56px;pointer-events:none;z-index:5}
.tile{position:absolute;width:56px;height:56px;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(135deg,#c8c8ff,#8a8af5 55%,#6a6ae0);
 border:1px solid #4a4ab8;border-radius:3px;box-shadow:2px 2px 0 rgba(60,20,80,.85);
 cursor:pointer;transition:transform .08s;z-index:2}
.tile:hover{filter:brightness(1.18)}
.tile.sel{background:linear-gradient(135deg,#c8ffc8,#58d858 55%,#35a835);border-color:#1a7018;transform:scale(1.06);z-index:3}
.tile.err{animation:errShake .35s;border-color:#ff2020!important;box-shadow:0 0 8px 2px rgba(255,40,40,.8)}
@keyframes errShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
.tile img{width:54px;height:54px;pointer-events:none;image-rendering:crisp-edges;image-rendering:pixelated}
@keyframes hf{0%,100%{box-shadow:2px 2px 0 rgba(60,20,80,.85)}50%{box-shadow:0 0 12px 4px #ff5252;transform:scale(1.12)}}
.tile.hint{animation:hf .5s ease-in-out infinite}
#toolbar{display:flex;gap:10px;margin-top:12px}
button{background:#3949ab;color:#fff;border:none;padding:8px 18px;border-radius:6px;font-size:14px;cursor:pointer}
button:hover{background:#5c6bc0}
button:disabled{opacity:.4;cursor:default}
#overlay{position:fixed;inset:0;background:rgba(10,10,20,.92);display:flex;align-items:center;justify-content:center;z-index:20}
#overlay.hidden{display:none}
#menuBox{display:flex;gap:18px;align-items:stretch;max-width:720px}
#menuBox img{width:340px;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.7)}
#menuPanel{background:#2a2a3d;padding:22px 28px;border-radius:10px;text-align:center;min-width:260px;display:flex;flex-direction:column;justify-content:center}
#menuPanel h2{color:#ffd54f;margin-bottom:14px}
#menuPanel label{display:block;margin:8px 0 4px;color:#aaa;font-size:13px}
#menuPanel select{width:100%;padding:6px;margin-bottom:6px;font-size:14px;background:#1e1e2e;color:#eee;border:1px solid #555;border-radius:4px}
#startBtn{margin-top:14px;font-size:16px;padding:10px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#000c;padding:8px 18px;border-radius:6px;font-size:14px;z-index:30;opacity:0;transition:opacity .3s;pointer-events:none}
#pauseMask{position:absolute;inset:0;background:#1e1e2ecc;z-index:10;display:none;align-items:center;justify-content:center;font-size:26px;color:#ffd54f;letter-spacing:4px}
</style>
</head>
<body>
<h1>🐾 宠物连连看 <span style="font-size:12px;color:#888">v2.0</span></h1>
<div id="statusbar">
  <span>难度：<b id="diffName">初级</b></span>
  <span>关卡：<b id="lv">1</b></span>
  <span>牌型：<b id="lay">固定不动</b></span>
  <div id="timebarWrap"><div id="timebar"></div></div>
  <span>洗牌：<b id="lives">3</b></span>
  <span>提示：<b id="hints">3</b></span>
  <span>得分：<b id="score">0</b></span>
</div>
<div id="boardWrap">
  <div id="board"></div>
  <canvas id="fx"></canvas>
  <div id="pauseMask">已暂停（按 P 或回车继续）</div>
</div>
<div id="toolbar">
  <button id="hintBtn">提示</button>
  <button id="shuffleBtn">重排（扣1次洗牌）</button>
  <button id="pauseBtn">暂停</button>
  <button id="soundBtn">🔊 音效开</button>
  <button id="menuBtn">返回菜单</button>
</div>
<div id="overlay">
  <div id="menuBox">
    <img src="assets/bg/title.jpg" alt="连连看4">
    <div id="menuPanel">
      <h2>游戏菜单</h2>
      <div id="ovMsg" style="min-height:22px;color:#ff8a80;margin-bottom:6px"></div>
      <label>选择难度</label>
      <select id="diffSel">
        <option value="0">初级（时间充裕）</option>
        <option value="1">中级</option>
        <option value="2">高级</option>
        <option value="3">特级（时间很紧）</option>
      </select>
      <label>选择图案</label>
      <select id="setSel">
        <option value="pet">宠物</option>
        <option value="jp">极品图案</option>
        <option value="sign">方位路标</option>
      </select>
      <label>起始关卡（测试用）</label>
      <select id="levelSel"></select>
      <button id="startBtn">开始游戏</button>
      <button id="rankBtn" style="margin-top:8px;background:#6d4c41">🏆 排行榜</button>
      <div style="margin-top:12px;font-size:12px;color:#888">规则：连接两张相同图案，连线转折不超过 2 次即可消除<br>每过一关洗牌次数 +1　P/回车：暂停　L：跳到下一关</div>
    </div>
  </div>
</div>
<div id="toast"></div>
<!-- 排行榜输入对话框 -->
<div id="rankDlg" class="hidden">
  <div style="background:#2a2a3d;padding:24px 30px;border-radius:10px;text-align:center;min-width:300px">
    <h2 id="rankTitle" style="color:#ffd54f;margin-bottom:6px">游戏结束</h2>
    <div id="rankReason" style="margin-bottom:10px;color:#ff8a80;font-size:14px"></div>
    <div id="rankScoreText" style="margin-bottom:14px;color:#aaa"></div>
    <input id="rankName" placeholder="输入你的名字" maxlength="12" style="width:100%;padding:8px;font-size:15px;background:#1e1e2e;color:#eee;border:1px solid #555;border-radius:4px;text-align:center;margin-bottom:12px">
    <div style="display:flex;gap:10px;justify-content:center">
      <button id="rankSave" style="background:#3949ab">保存成绩</button>
      <button id="rankSkip" style="background:#555">跳过</button>
    </div>
    <div id="rankTable" style="margin-top:16px;max-height:220px;overflow:auto"></div>
  </div>
</div>
<!-- 过关确认弹窗 -->
<div id="clearDlg" class="hidden">
  <div style="background:linear-gradient(160deg,#2e3350,#23273d);border:2px solid #7c83ff;border-radius:16px;padding:0;min-width:320px;box-shadow:0 12px 50px rgba(0,0,0,.7),0 0 30px rgba(124,131,255,.25);overflow:hidden;animation:clearPop .35s cubic-bezier(.2,1.4,.4,1)">
    <div style="background:linear-gradient(90deg,#5c6bc0,#7c83ff);padding:14px 20px;text-align:center">
      <div style="font-size:38px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))">🎉</div>
      <div style="font-size:20px;font-weight:bold;color:#fff;letter-spacing:2px;margin-top:2px;text-shadow:0 2px 4px rgba(0,0,0,.3)">过关了！</div>
    </div>
    <div style="padding:20px 26px 8px;text-align:center">
      <div style="font-size:14px;color:#aab">本关得分</div>
      <div id="clearGain" style="font-size:40px;font-weight:bold;color:#ffd54f;text-shadow:0 0 14px rgba(255,213,79,.5);margin:4px 0 2px">+0</div>
      <div id="clearDetail" style="font-size:12px;color:#889;margin-top:4px"></div>
      <div style="margin-top:12px;font-size:15px;color:#dde">当前总分 <b id="clearTotal" style="color:#8ab4ff;font-size:20px">0</b></div>
    </div>
    <div style="padding:14px 20px 20px;text-align:center">
      <button id="clearOk" style="background:linear-gradient(180deg,#66bb6a,#43a047);border:none;border-radius:8px;color:#fff;font-size:17px;font-weight:bold;padding:11px 48px;cursor:pointer;box-shadow:0 4px 14px rgba(67,160,71,.4);letter-spacing:3px">确 定</button>
    </div>
  </div>
</div>
<style>
@keyframes clearPop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}18%{transform:translate(-50%,-50%) scale(1.15)}62%{opacity:1;transform:translate(-50%,-75%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-150%) scale(1)}}
#clearOk:hover{filter:brightness(1.1)}
#clearOk:active{transform:translateY(2px)}
</style>
<!-- 排行榜查看对话框 -->
<div id="rankView" class="hidden">
  <div style="background:#2a2a3d;padding:24px 30px;border-radius:10px;text-align:center;min-width:320px">
    <h2 style="color:#ffd54f;margin-bottom:12px">🏆 排行榜</h2>
    <div id="rankViewTable" style="max-height:300px;overflow:auto"></div>
    <details style="margin-top:12px;text-align:left">
      <summary style="cursor:pointer;color:#888;font-size:12px">最近事件日志（排查"莫名退出"）</summary>
      <div id="logView" style="max-height:120px;overflow:auto;font-size:11px;color:#9f9;margin-top:6px;font-family:monospace;white-space:pre-wrap"></div>
    </details>
    <button id="rankClose" style="margin-top:14px;background:#3949ab">关闭</button>
  </div>
</div>
<style>
#rankDlg,#rankView{position:fixed;inset:0;background:rgba(10,10,20,.9);display:flex;align-items:center;justify-content:center;z-index:40}
#clearDlg{position:fixed;inset:0;background:rgba(8,10,20,.6);display:flex;align-items:center;justify-content:center;z-index:35}
#rankDlg.hidden,#rankView.hidden,#clearDlg.hidden{display:none}
</style>
<script>
"use strict";
const COLS=12, ROWS=8, TILE=56, MAX_LEVEL=11, KIND_COUNT=42;
const DIFF=[
 {name:"初级",time:220,bonus:10,shuffle:3},
 {name:"中级",time:170,bonus:20,shuffle:3},
 {name:"高级",time:130,bonus:30,shuffle:2},
 {name:"特级",time:95, bonus:40,shuffle:2}];
// 11 种运行模式（关卡序号 0~10），消除一对后触发对应位移
const LAYOUTS=[
 {name:"不变化",  mode:"none"},     // 0  不变化
 {name:"向下",    mode:"dir",dx:0,dy:1},  // 1  向下
 {name:"向左",    mode:"dir",dx:-1,dy:0}, // 2  向左
 {name:"上下分离",mode:"sepV"},     // 3  上下分离（上下两半各自向外压实）
 {name:"左右分离",mode:"sepH"},     // 4  左右分离（左右两半各自向外压实）
 {name:"上下集中",mode:"centerV"},  // 5  上下集中（上下两半各自向中线压实）
 {name:"左右集中",mode:"centerH"},  // 6  左右集中（左右两半各自向中线压实）
 {name:"上左下右",mode:"colSplit"}, // 7  上半区向左、下半区向右（按行分两半，水平滑）
 {name:"左下右上",mode:"rowSplit"}, // 8  左半区向下、右半区向上（按列分两半，竖直滑）
 {name:"向外扩散",mode:"outward"},  // 9  向外扩散（四象限各自向外压实）
 {name:"向内集中",mode:"inward"}    // 10 向内集中（四象限各自向中心压实）
];
// 原版音效映射(对照原程序)
const SFX={
 select:"select",       // 点选一张牌 (wav_138)
 match:"match",         // 消除一对 (wav_139)
 error:"error",         // 选中相同但不可消除 (wav_140)
 cancel:"cancel",       // 右键取消 / 点不相同自动取消 (wav_147)
 hint:"hint",           // 点击提示按钮 (wav_150)
 shuffle:"shuffle",     // 洗牌(自动+手动) (wav_152)
 win:"win",             // 每关通过(非最后一关) (wav_149)
 winall:"winall",       // 所有关通关/最终胜利 (wav_148)
 gameover:"gameover",   // GAMEOVER(时间耗尽/死局无洗牌) (wav_151)
 r_hint:"r_hint",       // 奖励:提示点 (wav_143)
 r_time:"r_time",       // 奖励:时间/分数 (wav_145)
 r_misc1:"r_misc1",     // 奖励:某种 (wav_146)
 r_misc2:"r_misc2",     // 奖励:某种 (wav_153)
 punish:"punish"        // 惩罚:倒扣提示/时间/分数 (wav_144)
};
const TIME_BONUS=2; // 每消除一对奖励的秒数
const boardEl=document.getElementById("board"),fx=document.getElementById("fx"),fctx=fx.getContext("2d");
const $=id=>document.getElementById(id);
let grid=[],tiles=new Map(),sel=null,hintPair=null;
let level=1,diff=0,score=0,lives=3,hints=3,remain=0,timer=null,paused=false,over=false,soundOn=true;
let startLevel=1; // 起始关卡（测试用，可从菜单选）
let tileSet=localStorage.getItem("llk_tileset")||"pet";
$("setSel").value=tileSet;
// ===== 资源预加载 =====
const IMG={pet:[],jp:[],sign:[]};
(function(){
 for(const s of["pet","jp","sign"])for(let i=0;i<KIND_COUNT;i++){const im=new Image();im.src=`assets/tiles/${s}_${String(i).padStart(2,"0")}.png`;IMG[s].push(im);}
})();
const AUDIO={};
for(const k in SFX){const a=new Audio(`assets/sfx/${SFX[k]}.wav`);a.preload="auto";AUDIO[k]=a;}
function play(k){if(!soundOn)return;const a=AUDIO[k];if(!a)return;try{a.currentTime=0;a.play().catch(()=>{});}catch(e){}}
// ===== BGM（原版 midi 转制合成曲，随机曲目循环）=====
const BGM_LIST=["assets/bgm/102.wav","assets/bgm/103.wav","assets/bgm/104.wav"];
let bgmOn=false,bgmAudio=null,bgmIdx=0;
function startBGM(){
 if(!bgmOn)return;
 if(!bgmAudio){bgmIdx=Math.floor(Math.random()*BGM_LIST.length);bgmAudio=new Audio(BGM_LIST[bgmIdx]);bgmAudio.volume=0.35;bgmAudio.onended=()=>{bgmIdx=(bgmIdx+1)%BGM_LIST.length;bgmAudio.src=BGM_LIST[bgmIdx];bgmAudio.play().catch(()=>{});};}
 bgmAudio.play().catch(()=>{});
}
function stopBGM(){if(bgmAudio)bgmAudio.pause();}
function setBGM(on){bgmOn=on;on?startBGM():stopBGM();}
// ===== 牌面 =====
function drawTile(el,kind){
 el.innerHTML="";
 const im=document.createElement("img");
 im.src=IMG[tileSet][kind].src;
 el.appendChild(im);
}
// ===== 工具 =====
function shuffled(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function toast(m){const t=$("toast");t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1600);}
// ===== 随机奖励/惩罚 =====
// 飘字提示：棋盘中央飘出文字，金色=奖励，红色=惩罚
function floatText(txt,type){
 const d=document.createElement("div");
 d.textContent=txt;
 d.style.cssText=`position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:15;
  font-size:34px;font-weight:900;pointer-events:none;white-space:nowrap;letter-spacing:1px;
  color:${type==="reward"?"#ffd54f":"#ff5252"};
  -webkit-text-stroke:1px ${type==="reward"?"#7a5200":"#7a1010"};
  text-shadow:0 0 14px ${type==="reward"?"rgba(255,213,79,.95)":"rgba(255,82,82,.95)"},0 0 4px #000,0 3px 5px rgba(0,0,0,.85);
  animation:floatUp 2.8s ease-out forwards`;
 boardEl.appendChild(d);
 setTimeout(()=>d.remove(),2900);
}
// 随机事件：消除后概率触发，奖励多惩罚少（约7:3）
function randomEvent(){
 if(Math.random()>=EVENT_CHANCE)return; // 触发概率
 const isReward=Math.random()<0.7;      // 奖励70% / 惩罚30%
 const kinds=isReward?REWARD_KINDS:PUNISH_KINDS;
 const k=kinds[Math.floor(Math.random()*kinds.length)];
 let txt="";
 switch(k){
  case "hint":
   if(isReward){hints++;txt="🎁 提示 +1";}else{if(hints<=0)return;hints--;txt="💢 提示 -1";}
   break;
  case "shuffle":
   if(isReward){lives++;txt="🎁 洗牌 +1";}else{if(lives<=0)return;lives--;txt="💢 洗牌 -1";}
   break;
  case "score":
   if(isReward){score+=10;txt="🎁 分数 +10";}else{if(score<=0)return;score=Math.max(0,score-10);txt="💢 分数 -10";}
   break;
  case "time":
   if(isReward){remain=Math.min(levelTime(),remain+10);txt="🎁 时间 +10s";}else{if(remain<=5)return;remain=Math.max(1,remain-10);txt="💢 时间 -10s";}
   break;
 }
 // 按原版：提示奖励=r_hint，时间/分数奖励=r_time，所有惩罚=punish
 play(k==="hint"&&isReward?"r_hint":(isReward?"r_time":"punish"));
 floatText(txt,isReward?"reward":"punish");
 logEvent(`随机${isReward?"奖励":"惩罚"}：${txt}`);
 updUI();
}
const EVENT_CHANCE=0.15;               // 每次消除15%概率触发随机事件
const REWARD_KINDS=["hint","shuffle","score","time"];
const PUNISH_KINDS=["hint","shuffle","score","time"];
// ===== 棋盘生成 =====
function emptyGrid(){return Array.from({length:ROWS+2},()=>Array(COLS+2).fill(-1));}
function fillPositions(){
 const L=LAYOUTS[(level-1)%LAYOUTS.length];const pts=[];
 // 所有牌型都在真实8×12棋盘上生成，保证坐标合法；分离效果靠消除后的重力位移呈现
 for(let y=1;y<=ROWS;y++)for(let x=1;x<=COLS;x++)pts.push([x,y]);
 return pts;
}
// 按难度限制图案种类（原程序：简单模式只用部分图案）
// 初级21种 / 中级28种 / 高级35种 / 特级42种
const POOL_SIZES=[21,28,35,42];
function kinds48(){
 const pool=POOL_SIZES[diff]||21;
 const order=shuffled([...Array(pool).keys()]);
 const ks=[];for(let i=0;i<COLS*ROWS/2;i++)ks.push(order[i%pool]);
 return ks;
}
function setupCanvas(){
 boardEl.style.width=COLS*TILE+"px";
 boardEl.style.height=ROWS*TILE+"px";
 // canvas 比棋盘大一圈（四周各留 TILE），以容纳绕外圈的连线
 fx.width=(COLS+2)*TILE;fx.height=(ROWS+2)*TILE;
 fx.style.width=(COLS+2)*TILE+"px";fx.style.height=(ROWS+2)*TILE+"px";
}
function buildBoard(){ // 根据当前 level 铺牌（牌型由 level 决定）
 grid=emptyGrid();
 const kinds=kinds48(),deck=shuffled(kinds.concat(kinds)),pts=fillPositions();
 pts.forEach((p,i)=>grid[p[1]][p[0]]=deck[i]);
 remain=levelTime();sel=null;
 renderAll();updUI();
}
function newGame(){
 setupCanvas();
 level=startLevel;lives=DIFF[diff].shuffle;hints=3;score=0;over=false;paused=false;
 $("pauseMask").style.display="none";
 buildBoard();startTimer();play("levelstart");
}
function levelTime(){return DIFF[diff].time;}
function nextLevel(){
 level++;
 lives++; // 每过一关，洗牌次数 +1
 if(level>MAX_LEVEL){finishGame();return;}
 logEvent(`进入第${level}关，洗牌次数+1（现有${lives}）`);
 buildBoard();play("levelstart");
}
// ===== 渲染 =====
function renderAll(){
 tiles.forEach(el=>el.remove());tiles.clear();
 for(let y=1;y<=ROWS;y++)for(let x=1;x<=COLS;x++){
  const k=grid[y][x];if(k<0)continue;
  const el=document.createElement("div");el.className="tile";
  el.dataset.x=x;el.dataset.y=y;
  el.style.left=(x-1)*TILE+"px";el.style.top=(y-1)*TILE+"px";
  drawTile(el,k);
  el.onclick=()=>onTile(+el.dataset.x,+el.dataset.y); // 读取位移后的当前坐标
  el.oncontextmenu=e=>{e.preventDefault();onRightClick();};
  boardEl.appendChild(el);tiles.set(x+","+y,el);
 }
}
function moveTileEl(x,y){
 const t=tiles.get(x+","+y);if(!t)return;
 t.dataset.x=x;t.dataset.y=y; // 同步当前坐标，点击时才能取到正确值
 t.style.left=(x-1)*TILE+"px";t.style.top=(y-1)*TILE+"px";
}
// ===== 连通性（核心逻辑）=====
function cellFree(x,y,ax,ay,bx,by){
 if(x<0||x>COLS+1||y<0||y>ROWS+1)return false;
 if((x===ax&&y===ay)||(x===bx&&y===by))return true;
 return grid[y][x]<0;
}
function canLink(ax,ay,bx,by){
 const g=grid;
 if(g[ay][ax]<0||g[by][bx]<0||g[ay][ax]!==g[by][bx])return null;
 const ok=(x,y)=>cellFree(x,y,ax,ay,bx,by);
 if(ax===bx){let clear=true;for(let y=Math.min(ay,by)+1;y<Math.max(ay,by);y++)if(!ok(ax,y)){clear=false;break;}
  if(clear)return[[ax,ay],[bx,by]];}
 if(ay===by){let clear=true;for(let x=Math.min(ax,bx)+1;x<Math.max(ax,bx);x++)if(!ok(x,ay)){clear=false;break;}
  if(clear)return[[ax,ay],[bx,by]];}
 if(ok(ax,by)&&segV(ax,ay,by,ok)&&segH(by,ax,bx,ok))return[[ax,ay],[ax,by],[bx,by]];
 if(ok(bx,ay)&&segH(ay,ax,bx,ok)&&segV(bx,ay,by,ok))return[[ax,ay],[bx,ay],[bx,by]];
 for(let y=0;y<=ROWS+1;y++){
  if(!ok(ax,y)||!ok(bx,y))continue;
  if(segV(ax,ay,y,ok)&&segH(y,ax,bx,ok)&&segV(bx,by,y,ok))
   return[[ax,ay],[ax,y],[bx,y],[bx,by]];
 }
 for(let x=0;x<=COLS+1;x++){
  if(!ok(x,ay)||!ok(x,by))continue;
  if(segH(ay,ax,x,ok)&&segV(x,ay,by,ok)&&segH(by,x,bx,ok))
   return[[ax,ay],[x,ay],[x,by],[bx,by]];
 }
 return null;
}
function segV(x,y1,y2,ok){if(y1===y2)return true;for(let y=Math.min(y1,y2)+1;y<Math.max(y1,y2);y++)if(!ok(x,y))return false;return true;}
function segH(y,x1,x2,ok){if(x1===x2)return true;for(let x=Math.min(x1,x2)+1;x<Math.max(x1,x2);x++)if(!ok(x,y))return false;return true;}
function findHint(){
 for(let y1=1;y1<=ROWS;y1++)for(let x1=1;x1<=COLS;x1++){
  if(grid[y1][x1]<0)continue;
  for(let y2=y1;y2<=ROWS;y2++){
   const xs=(y2===y1)?x1+1:1;
   for(let x2=xs;x2<=COLS;x2++){
    if(grid[y2][x2]<0)continue;
    const path=canLink(x1,y1,x2,y2);
    if(path)return{a:[x1,y1],b:[x2,y2],path};
   }
  }
 }
 return null;
}
// ===== 点击 =====
// 右键：取消当前点选
function onRightClick(){
 if(paused||over)return;
 if(sel){const t=tiles.get(sel[0]+","+sel[1]);if(t)t.classList.remove("sel");sel=null;play("cancel");}
 clearHintFlash();
}
function onTile(x,y){
 if(paused||over)return;
 const k=grid[y][x];if(k<0)return;
 clearHintFlash();
 if(!sel){sel=[x,y];tiles.get(x+","+y).classList.add("sel");play("select");return;}
 if(sel[0]===x&&sel[1]===y){tiles.get(x+","+y).classList.remove("sel");sel=null;return;}
 const path=canLink(sel[0],sel[1],x,y);
 if(path){
  // 先画连线并保留牌，停留后再消除，让用户看到连线过程
  drawPath(path,"#ff4040");play("match");
  const t1=tiles.get(sel[0]+","+sel[1]),t2=tiles.get(x+","+y);
  // 两张牌同步高亮
  if(t1)t1.classList.add("sel");
  if(t2)t2.classList.add("sel");
  const ax=sel[0],ay=sel[1];
  grid[ay][ax]=-1;grid[y][x]=-1;
  tiles.delete(ax+","+ay);tiles.delete(x+","+y);
  sel=null;
  setTimeout(()=>{fctx.clearRect(0,0,fx.width,fx.height);t1.remove();t2.remove();applyGravity();
   score+=2;
   // 每消除一对奖励时间，封顶不超过本关总时间
   remain=Math.min(levelTime(),remain+TIME_BONUS);
   randomEvent(); // 消除后随机触发奖励/惩罚
   updUI();checkState();},180);
 }else{
  // 点了第二张但无法与第一张消除
  const same=grid[y][x]===grid[sel[1]][sel[0]];
  tiles.get(sel[0]+","+sel[1]).classList.remove("sel");
  if(same){
   // 相同图案但不可消除：报错音 + 红色抖动提示 + 取消所有选择
   play("error");
   const t2=tiles.get(x+","+y);
   if(t2){t2.classList.add("err");setTimeout(()=>{const t=tiles.get(x+","+y);if(t)t.classList.remove("err");},350);}
   sel=null;
  }else{
   // 不同图案 → 自动取消前一张，改选新牌，播取消音
   play("cancel");
   sel=[x,y];tiles.get(x+","+y).classList.add("sel");
  }
 }
}
function drawPath(path,color){
 fctx.clearRect(0,0,fx.width,fx.height);
 fctx.strokeStyle=color;fctx.lineWidth=3;fctx.lineCap="round";fctx.lineJoin="round";
 fctx.shadowColor=color;fctx.shadowBlur=6;
 fctx.beginPath();
 // 网格坐标 + TILE 偏移（因为 canvas 向左上扩了一圈）
 path.forEach((p,i)=>{const px=p[0]*TILE+TILE/2,py=p[1]*TILE+TILE/2;i?fctx.lineTo(px,py):fctx.moveTo(px,py);});
 fctx.stroke();
 fctx.shadowBlur=0;
}
// ===== 牌型位移 =====
// 压实一行：把 y 行 [x1,x2] 区间内的牌向 rev?右:左 边界压实，保持相对顺序，空洞移到另一端。同步更新 grid、tiles、DOM
function compactRow(y,x1,x2,rev){
 const xs=[];for(let x=x1;x<=x2;x++)xs.push(x);
 // 收集区间内的 {val, el}（按 x 升序，保持相对顺序）
 const items=[];
 for(const x of xs){
  const el=tiles.get(x+","+y);
  if(el&&grid[y][x]>=0)items.push({val:grid[y][x],el});
  tiles.delete(x+","+y);grid[y][x]=-1;
 }
 // 目标填充顺序：左靠从 x1 向右填，右靠从 x2 向左填
 const fillOrder=rev?xs.slice().reverse():xs;
 const fillItems=rev?items.slice().reverse():items;
 fillOrder.forEach((x,i)=>{
  const it=fillItems[i];if(!it)return;
  grid[y][x]=it.val;
  tiles.set(x+","+y,it.el);
  it.el.dataset.x=x;it.el.dataset.y=y;
  moveTileEl(x,y);
 });
}
// 压实一列：把 x 列 [y1,y2] 区间内的牌向 rev?下:上 边界压实
function compactCol(x,y1,y2,rev){
 const ys=[];for(let y=y1;y<=y2;y++)ys.push(y);
 const items=[];
 for(const y of ys){
  const el=tiles.get(x+","+y);
  if(el&&grid[y][x]>=0)items.push({val:grid[y][x],el});
  tiles.delete(x+","+y);grid[y][x]=-1;
 }
 const fillOrder=rev?ys.slice().reverse():ys;
 const fillItems=rev?items.slice().reverse():items;
 fillOrder.forEach((y,i)=>{
  const it=fillItems[i];if(!it)return;
  grid[y][x]=it.val;tiles.set(x+","+y,it.el);it.el.dataset.x=x;it.el.dataset.y=y;moveTileEl(x,y);
 });
}
function applyGravity(){
 const L=LAYOUTS[(level-1)%LAYOUTS.length];
 const MX=COLS/2, MY=ROWS/2; // 中线：6|7 列之间、4|5 行之间
 switch(L.mode){
  case "none": break; // 0 不变化
  case "dir": // 1/2 单向平移：整体向一个方向压实（空洞移到反方向边界）
   if(L.dx<0)for(let y=1;y<=ROWS;y++)compactRow(y,1,COLS,false); // 向左
   if(L.dx>0)for(let y=1;y<=ROWS;y++)compactRow(y,1,COLS,true);  // 向右
   if(L.dy<0)for(let x=1;x<=COLS;x++)compactCol(x,1,ROWS,false); // 向上
   if(L.dy>0)for(let x=1;x<=COLS;x++)compactCol(x,1,ROWS,true);  // 向下
   break;
  case "sepH": // 4 左右分离：左半区向左、右半区向右压实，空洞移到中线
   for(let y=1;y<=ROWS;y++){compactRow(y,1,MX,false);compactRow(y,MX+1,COLS,true);}
   break;
  case "sepV": // 3 上下分离：上半区向上、下半区向下压实，空洞移到中线
   for(let x=1;x<=COLS;x++){compactCol(x,1,MY,false);compactCol(x,MY+1,ROWS,true);}
   break;
  case "centerH": // 6 左右集中：左半区向右、右半区向左压实（向中线），空洞移到两侧边界
   for(let y=1;y<=ROWS;y++){compactRow(y,1,MX,true);compactRow(y,MX+1,COLS,false);}
   break;
  case "centerV": // 5 上下集中：上半区向下、下半区向上压实（向中线），空洞移到上下边界
   for(let x=1;x<=COLS;x++){compactCol(x,1,MY,true);compactCol(x,MY+1,ROWS,false);}
   break;
  case "colSplit": // 7 上左下右：上半区向左、下半区向右（按行分上下两半，行内水平压实）
   for(let y=1;y<=MY;y++)compactRow(y,1,COLS,false);      // 上半区各行：向左
   for(let y=MY+1;y<=ROWS;y++)compactRow(y,1,COLS,true);   // 下半区各行：向右
   break;
  case "rowSplit": // 8 左下右上：左半区向下、右半区向上（按列分左右两半，列内竖直压实）
   for(let x=1;x<=MX;x++)compactCol(x,1,ROWS,true);        // 左半区各列：向下
   for(let x=MX+1;x<=COLS;x++)compactCol(x,1,ROWS,false);  // 右半区各列：向上
   break;
  case "outward": // 9 向外扩散：每个象限内的牌向其外角压实，空洞移到中心十字
   // 左上象限(行1~MY,列1~MX)：行内向左、列内向上
   compactQuad(1,MY,1,MX,false,false);
   // 右上象限(行1~MY,列MX+1~COLS)：行内向右、列内向上
   compactQuad(1,MY,MX+1,COLS,true,false);
   // 左下象限(行MY+1~ROWS,列1~MX)：行内向左、列内向下
   compactQuad(MY+1,ROWS,1,MX,false,true);
   // 右下象限(行MY+1~ROWS,列MX+1~COLS)：行内向右、列内向下
   compactQuad(MY+1,ROWS,MX+1,COLS,true,true);
   break;
  case "inward": // 10 向内集中：每个象限内的牌向中心压实，空洞移到四边界
   compactQuad(1,MY,1,MX,true,true);        // 左上：向右、向下
   compactQuad(1,MY,MX+1,COLS,false,true);  // 右上：向左、向下
   compactQuad(MY+1,ROWS,1,MX,true,false);  // 左下：向右、向上
   compactQuad(MY+1,ROWS,MX+1,COLS,false,false); // 右下：向左、向上
   break;
 }
}
// 象限二维压实：把 [y1,y2]×[x1,x2] 区域内的牌，行内向 revH?右:左、列内向 revV?下:上 压实
// 先按行压实，再按列压实（收集-重排，安全）
function compactQuad(y1,y2,x1,x2,revH,revV){
 for(let y=y1;y<=y2;y++)compactRow(y,x1,x2,revH);
 for(let x=x1;x<=x2;x++)compactCol(x,y1,y2,revV);
}
// ===== 状态 =====
function tilesLeft(){let n=0;for(let y=1;y<=ROWS;y++)for(let x=1;x<=COLS;x++)if(grid[y][x]>=0)n++;return n;}
function checkState(){
 if(tilesLeft()===0){
  const timeBonus=Math.round(remain),diffBonus=DIFF[diff].bonus,gain=timeBonus+diffBonus;
  score=Math.round(score+gain);updUI();play("win");
  logEvent(`第${level}关过关，+${gain}分（时间${timeBonus}+难度${diffBonus}），总分${score}`);
  setTimeout(()=>showClearDialog(gain,timeBonus,diffBonus),600);
  return;
 }
 if(!findHint())autoShuffle();
}
// 过关确认弹窗：显示本关得分，点确定才进下一关
function showClearDialog(gain,timeBonus,diffBonus){
 clearInterval(timer); // 暂停计时，等用户确认
 $("clearGain").textContent="+"+gain;
 $("clearDetail").textContent=`时间奖励 +${timeBonus}　难度奖励 +${diffBonus}`;
 $("clearTotal").textContent=Math.round(score);
 $("clearDlg").classList.remove("hidden");
}
$("clearOk").onclick=()=>{
 $("clearDlg").classList.add("hidden");
 nextLevel();
 if(!over)startTimer(); // 恢复计时（通关时nextLevel会触发finishGame，不重启）
};
function autoShuffle(){
 if(lives>=1){lives--;reshuffle(false);toast("死局！自动重排，洗牌次数 -1");updUI();}
 else gameOver("无可消除的组合，且洗牌次数不足");
}
function reshuffle(free){
 const kinds=[];
 for(let y=1;y<=ROWS;y++)for(let x=1;x<=COLS;x++)if(grid[y][x]>=0)kinds.push(grid[y][x]);
 let tries=0;
 do{
  const d=shuffled(kinds.slice());let i=0;
  for(let y=1;y<=ROWS;y++)for(let x=1;x<=COLS;x++)if(grid[y][x]>=0)grid[y][x]=d[i++];
  renderAll();
  if(findHint())break;
 }while(++tries<50);
 play("shuffle");
}
// ===== 提示 =====
function clearHintFlash(){document.querySelectorAll(".tile.hint").forEach(e=>e.classList.remove("hint"));}
function doHint(){
 if(paused||over)return;
 const h=findHint();
 if(!h){toast("没有可消除的组合");return;}
 if(hints>0){hints--;updUI();}
 clearHintFlash();
 const e1=tiles.get(h.a[0]+","+h.a[1]),e2=tiles.get(h.b[0]+","+h.b[1]);
 if(e1)e1.classList.add("hint");if(e2)e2.classList.add("hint");
 drawPath(h.path,"#ff5252");play("hint");
 setTimeout(()=>{clearHintFlash();fctx.clearRect(0,0,fx.width,fx.height);},3000);
}
// ===== 计时 =====
function startTimer(){
 clearInterval(timer);
 timer=setInterval(()=>{
  if(paused||over)return;
  remain=Math.max(0,remain-0.1);
  if(remain<=10&&Math.abs(remain%1)<0.05)play("tick");
  updTime();
  if(remain<=0)gameOver("时间到！");
 },100);
}
function gameOver(msg){
 over=true;clearInterval(timer);play("gameover");
 $("ovMsg").textContent=msg+`　最终得分：${Math.round(score)}`;
 logEvent(`游戏结束：${msg}（第${level}关，得分${score}，剩余洗牌${lives}）`);
 promptRank(score,false,msg);
}
// 调试事件日志：记录关键事件，便于排查“莫名退出”
function logEvent(msg){
 try{
  const logs=JSON.parse(localStorage.getItem("llk_logs")||"[]");
  logs.push(new Date().toLocaleTimeString()+" "+msg);
  localStorage.setItem("llk_logs",JSON.stringify(logs.slice(-20))); // 只留最近20条
 }catch(e){}
}
// ===== 排行榜 =====
function loadRanks(){try{return JSON.parse(localStorage.getItem("llk_ranks")||"[]");}catch(e){return [];}}
function saveRank(name,sc,df){
 const r=loadRanks();r.push({name,score:Math.round(sc),diff:DIFF[df].name,time:Date.now()});
 r.sort((a,b)=>b.score-a.score);const top=r.slice(0,20);
 localStorage.setItem("llk_ranks",JSON.stringify(top));return top;
}
// 游戏结束（通关或失败）后提示输入名字并写入排行榜
function promptRank(sc,cleared,reason){
 const title=cleared?`🎉 通关全部 ${MAX_LEVEL} 关！`:'游戏结束';
 $("rankTitle").textContent=title;
 // 明确显示结束原因（时间到/死局/通关），避免“莫名退出”
 $("rankReason").textContent=cleared?"全部关卡完成！":(reason||"");
 $("rankScoreText").textContent=`最终得分：${Math.round(sc)}　难度：${DIFF[diff].name}`;
 $("rankName").value=localStorage.getItem("llk_name")||"";
 $("rankDlg").classList.remove("hidden");
}
function finishGame(){ // 11 关全部通关
 over=true;clearInterval(timer);play("winall");
 logEvent(`通关全部${MAX_LEVEL}关，得分${score}`);
 promptRank(score,true);
}
function renderRankTable(targetId){
 const r=loadRanks();
 const tb=$(targetId);
 if(!r.length){tb.innerHTML='<div style="color:#ccc;text-align:center;padding:20px;font-size:14px">暂无成绩记录<br><span style="color:#888;font-size:12px">通关一个难度后会记录在这里</span></div>';return;}
 let h='<table style="width:100%;border-collapse:collapse;font-size:13px">';
 h+='<tr style="color:#ffd54f"><th style="padding:3px">#</th><th>名字</th><th>分数</th><th>难度</th></tr>';
 r.forEach((it,i)=>{h+=`<tr style="border-top:1px solid #444;text-align:center"><td style="padding:3px">${i+1}</td><td>${it.name}</td><td><b style="color:#ffd54f">${Math.round(it.score)}</b></td><td>${it.diff||''}</td></tr>`;});
 h+='</table>';tb.innerHTML=h;
}
// ===== UI =====
function updUI(){
 $("lv").textContent=level;$("lay").textContent=LAYOUTS[(level-1)%LAYOUTS.length].name;
 $("lives").textContent=lives;$("hints").textContent=hints;$("score").textContent=Math.round(score);
 $("diffName").textContent=DIFF[diff].name;updTime();
}
function updTime(){
 const total=levelTime(),p=Math.max(0,remain/total*100);
 const bar=$("timebar");bar.style.width=p+"%";
 bar.classList.toggle("low",remain<=20);
}
// ===== 暂停 =====
function togglePause(){
 if(over)return;
 paused=!paused;
 $("pauseMask").style.display=paused?"flex":"none";
 boardEl.style.visibility=paused?"hidden":"visible";
 $("pauseBtn").textContent=paused?"继续":"暂停";
}
// ===== 事件 =====
$("hintBtn").onclick=doHint;
$("shuffleBtn").onclick=()=>{if(paused||over)return;if(lives<1){toast("洗牌次数不足！");play("error");return;}lives--;reshuffle();updUI();};
$("pauseBtn").onclick=togglePause;
document.addEventListener("keydown",e=>{
 if(e.key==="p"||e.key==="P"||e.key==="Enter")togglePause();
 if(e.key==="l"||e.key==="L"){ // 测试用：跳到下一关
  if(over)return;
  clearInterval(timer);nextLevel();startTimer();
 }
});
// 棋盘上任意右键都阻止默认菜单（含空白区域）
document.getElementById("boardWrap").addEventListener("contextmenu",e=>{e.preventDefault();onRightClick();});
$("soundBtn").onclick=()=>{soundOn=!soundOn;setBGM(soundOn);$("soundBtn").textContent=soundOn?"🔊 音效·音乐开":"🔇 音效·音乐关";};
$("menuBtn").onclick=()=>{over=true;clearInterval(timer);stopBGM();$("overlay").classList.remove("hidden");$("ovMsg").textContent="";};
$("startBtn").onclick=()=>{
 diff=+$("diffSel").value;tileSet=$("setSel").value;
 startLevel=+$("levelSel").value||1;
 localStorage.setItem("llk_tileset",tileSet);
 $("overlay").classList.add("hidden");newGame();
};
// ===== 排行榜事件 =====
$("rankSave").onclick=()=>{
 const name=$("rankName").value.trim()||"匿名";
 localStorage.setItem("llk_name",name);
 saveRank(name,score,diff);
 renderRankTable("rankTable");
 $("rankSave").disabled=true;
 setTimeout(()=>{ $("rankDlg").classList.add("hidden"); $("rankSave").disabled=false; $("overlay").classList.remove("hidden"); },1200);
};
$("rankSkip").onclick=()=>{ $("rankDlg").classList.add("hidden"); $("overlay").classList.remove("hidden"); };
$("rankBtn").onclick=()=>{
 renderRankTable("rankViewTable");
 try{ const logs=JSON.parse(localStorage.getItem("llk_logs")||"[]");
  $("logView").textContent=logs.length?logs.join("\n"):"（暂无事件记录）";
 }catch(e){ $("logView").textContent="（暂无事件记录）"; }
 $("rankView").classList.remove("hidden");
};
$("rankClose").onclick=()=>{ $("rankView").classList.add("hidden"); };
// 初始化起始关卡下拉框（1~MAX_LEVEL，显示牌型名）
(function(){
 const sel=$("levelSel");
 for(let i=1;i<=MAX_LEVEL;i++){
  const opt=document.createElement("option");
  opt.value=i;
  opt.textContent=`第${i}关（${LAYOUTS[(i-1)%LAYOUTS.length].name}）`;
  sel.appendChild(opt);
 }
})();
boardEl.style.position="relative";
</script>
