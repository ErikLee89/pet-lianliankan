<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>64×64 图标试样</title>
<style>
body{background:#202030;color:#eee;font:16px 'Microsoft YaHei',sans-serif;margin:40px}
h1{font-size:23px}p{color:#bbb}table{border-spacing:16px;text-align:center}th{font-weight:normal;color:#ccc}
td{padding:12px 22px;background:#303045;border-radius:8px}.icon{display:inline-flex;width:76px;height:76px;align-items:center;justify-content:center;background:#aaaaff;border-radius:3px}
img{width:64px;height:64px}.pixel{image-rendering:pixelated}.original{width:39px;height:39px;image-rendering:pixelated}
a{color:#aecaff}small{display:block;margin-top:8px}
</style>
<h1>64×64 图标试样</h1><p>按实际显示尺寸对比。右列采用平滑缩放，轮廓会柔和一些，原图的像素结构仍会部分保留。</p>
<table><thead><tr><th>原图 39×39</th><th>像素放大 64×64</th><th>平滑放大 64×64</th></tr></thead><tbody id="rows"></tbody></table>
<script>
for(const n of ['07','06','02','01']){
 const tr=document.createElement('tr');
 for(const mode of ['original','pixel','smooth']){
  const td=document.createElement('td'),box=document.createElement('span'),im=document.createElement('img');
  box.className='icon';im.className=mode;
  im.src=mode==='smooth'?`smooth64/pet_${n}.png`:`../assets/tiles/pet_${n}.png`;
  box.append(im);td.append(box);tr.append(td);
 }
 rows.append(tr);
}
</script></html>
