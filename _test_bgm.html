<!DOCTYPE html>
<html><head><meta charset="utf-8"></head><body>
<div id=out></div>
<script>
(async()=>{
 const out=document.getElementById("out");
 const t0=performance.now();
 const a=new Audio("assets/bgm/102.mp3");
 a.volume=0.35;
 a.onplaying=()=>{out.textContent="PLAYING in "+((performance.now()-t0)|0)+"ms readyState="+a.readyState;document.title="BGMTEST-OK";};
 try{await a.play();}catch(e){out.textContent="ERR:"+e.message;document.title="BGMTEST-ERR";}
 setTimeout(()=>{if(document.title!=="BGMTEST-OK")out.textContent+=" | TIMEOUT8s readyState="+a.readyState+" networkState="+a.networkState;document.title="BGMTEST-DUMP";},8000);
})();
</script></body></html>
